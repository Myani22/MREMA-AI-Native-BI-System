services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mrema}
      POSTGRES_USER: ${POSTGRES_USER:-mrema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mrema_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mrema} -d ${POSTGRES_DB:-mrema}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mrema}:${POSTGRES_PASSWORD:-mrema_dev_password}@postgres:5432/${POSTGRES_DB:-mrema}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
